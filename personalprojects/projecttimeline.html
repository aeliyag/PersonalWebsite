<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../style.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Timeline | Aeliya Grover</title>
</head>
<body>
  <script src="../assets/js/global.js"></script>
  <div id="navbar"></div>

  <main style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
    <div id="timeline"></div>
  </main>

  <div id="footer"></div>

  <script>
    loadPartial('/nav.html', 'navbar');
    loadPartial('/footer.html', 'footer');

    loadPartial('/personalprojects/timeline.html', 'timeline').then(() => {
      const items = document.querySelectorAll('.timeline-item');
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) entry.target.classList.add('show');
          });
        },
        { threshold: 0.2 }
      );
      items.forEach((item) => observer.observe(item));
    });
  </script>
</body>
</html>
